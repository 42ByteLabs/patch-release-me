name: Build and Test

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-test:
    # https://github.com/42ByteLabs/.github/blob/main/.github/workflows/cargo.yml
    uses: 42ByteLabs/.github/.github/workflows/cargo.yml@865c36613799988f036ed780621e010ea0bd7750 # v0.14
    secrets: inherit
    permissions:
      contents: read
      actions: read
      security-events: write
  
  container-testing:
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: "Build and Test"
        run: |
          docker build -t patch-release-me .
          docker run --rm patch-release-me --help
          docker run --rm patch-release-me display
